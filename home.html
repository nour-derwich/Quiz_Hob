<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at 20% 10%, #54213f 0, transparent 35%),
    radial-gradient(circle at 90% 80%, #3b173e 0, transparent 35%),
    linear-gradient(145deg, #100914, #1c0d1d 55%, #100914);
  overflow-x: hidden;
}

.app {
  max-width: 720px;
  margin: auto;
  padding: 24px 16px 40px;
}

header {
  text-align: center;
  padding: 18px 0 20px;
}

.heart {
  font-size: 42px;
  filter: drop-shadow(0 0 18px #ff5c9d);
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  50% {
    transform: scale(1.08);
  }
}

h1 {
  margin: 5px 0;
  font-size: 30px;
}

.subtitle {
  color: #d8bfd3;
  margin: 0;
}

.pack {
  display: inline-block;
  margin-top: 12px;
  padding: 7px 13px;
  border: 1px solid #704260;
  border-radius: 999px;
  color: #ffb8d5;
  font-size: 13px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
  animation: fade .3s ease;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.category {
  border: 1px solid #58324e;
  background: rgba(255,255,255,.055);
  color: #fff;
  border-radius: 20px;
  padding: 20px 14px;
  min-height: 112px;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  box-shadow: 0 8px 30px rgba(0,0,0,.18);
  transition: .2s;
  cursor: pointer;
}

.category:hover,
.category:active {
  transform: translateY(-2px);
  background: rgba(255,92,157,.13);
  border-color: #b15a85;
}

.category small {
  display: block;
  color: #bda5b9;
  margin-top: 7px;
  font-weight: 400;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 10px;
}

button {
  font: inherit;
}

.btn {
  border: 1px solid #633a57;
  background: #251329;
  color: #fff;
  border-radius: 13px;
  padding: 10px 14px;
  cursor: pointer;
}

.btn.primary {
  background: linear-gradient(135deg, #e34f91, #8e3f9e);
  border: 0;
  box-shadow: 0 8px 25px rgba(210,65,130,.25);
}

.title {
  text-align: center;
  flex: 1;
}

.title h2 {
  margin: 0;
  font-size: 20px;
}

.count {
  color: #bda5b9;
  font-size: 13px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
  margin: 18px 0;
}

.card {
  aspect-ratio: 1 / 1.18;
  border: 1px solid #643d5b;
  border-radius: 15px;
  background: linear-gradient(145deg, #2b142d, #170d1d);
  color: #ffb5d2;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 22px rgba(0,0,0,.2);
  transition: .2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #ca6d9c;
}

.card.used {
  opacity: .35;
  cursor: default;
  transform: none;
}

.random {
  text-align: center;
  margin: 8px 0 20px;
}

.question-box {
  min-height: 330px;
  border: 1px solid #70405f;
  border-radius: 28px;
  padding: 28px 22px;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.09),
    rgba(255,255,255,.035)
  );
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  position: relative;
  overflow: hidden;
}

.question-box:before {
  content: "❤";
  position: absolute;
  font-size: 170px;
  opacity: .035;
  left: -20px;
  bottom: -50px;
}

.q-label {
  color: #ff9fc3;
  font-size: 14px;
  margin-bottom: 20px;
}

.question {
  font-size: 25px;
  line-height: 1.7;
  font-weight: 700;
  position: relative;
  z-index: 1;
}

.turn {
  margin-top: 20px;
  color: #d8bfd3;
  font-size: 14px;
}

.turn strong {
  color: #ffb5d2;
}

.actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 16px;
  flex-wrap: wrap;
}

.hint {
  text-align: center;
  color: #9f8799;
  font-size: 12px;
  margin-top: 14px;
}

@media (max-width: 430px) {
  .app {
    padding: 15px 12px 30px;
  }

  .grid {
    gap: 9px;
  }

  .category {
    padding: 16px 9px;
    min-height: 102px;
  }

  .cards {
    gap: 7px;
  }

  .card {
    border-radius: 12px;
  }

  .question {
    font-size: 22px;
  }
}
</style>
</head>

  <div class="actions">

    <button

</section>

/* =====================================================
   GAME STATE
===================================================== */

let currentCategory = "";
let currentIndex = 0;
let turn = 0;

const players = [
  "Nour",
  "Mehdi"
];


/* =====================================================
   HELPERS
===================================================== */

function $(id) {
  return document.getElementById(id);
}


/* =====================================================
   SCREEN NAVIGATION
===================================================== */

function show(id) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.remove("active");
    });

  $(id).classList.add("active");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories() {

  $("categoryGrid").innerHTML = "";

  Object.entries(data).forEach(([name, questions]) => {

    const button = document.createElement("button");

    button.className = "category";

    button.innerHTML = `
      ${name}
      <small>
        ${questions.length} أسئلة
      </small>
    `;

    button.onclick = () => {
      openCategory(name);
    };

    $("categoryGrid").appendChild(button);

  });
}


/* =====================================================
   OPEN CATEGORY
===================================================== */

function openCategory(name) {

  currentCategory = name;

  $("categoryTitle").textContent = name;

  const cards = $("cards");

  cards.innerHTML = "";

  data[name].forEach((_, index) => {

    const button = document.createElement("button");

    button.className = "card";

    button.textContent = index + 1;

    button.onclick = () => {
      openQuestion(index, button);
    };

    cards.appendChild(button);

  });

  show("numbers");
}


/* =====================================================
   OPEN QUESTION
===================================================== */

function openQuestion(index, button) {

  currentIndex = index;

  if (button) {
    button.classList.add("used");
  }

  $("questionCategory").textContent =
    currentCategory;

  $("questionNumber").textContent =
    `السؤال ${index + 1} / ${data[currentCategory].length}`;

  $("questionText").textContent =
    data[currentCategory][index];

  $("turnName").textContent =
    players[turn];

  show("questionScreen");
}


/* =====================================================
   CHANGE TURN
===================================================== */

function toggleTurn() {

  turn = turn ? 0 : 1;

  $("turnName").textContent =
    players[turn];
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

  turn = turn ? 0 : 1;

  let next =
    (currentIndex + 1) %
    data[currentCategory].length;

  currentIndex = next;

  $("questionNumber").textContent =
    `السؤال ${next + 1} / ${data[currentCategory].length}`;

  $("questionText").textContent =
    data[currentCategory][next];

  $("turnName").textContent =
    players[turn];
}


/* =====================================================
   RANDOM QUESTION
===================================================== */

function randomQuestion() {

  const categories =
    Object.keys(data);

  if (!currentCategory) {

    currentCategory =
      categories[
        Math.floor(
          Math.random() * categories.length
        )
      ];

  }

  const index =
    Math.floor(
      Math.random() *
      data[currentCategory].length
    );


  if (!$("numbers").classList.contains("active")) {

    $("questionCategory").textContent =
      currentCategory;

    $("questionNumber").textContent =
      `السؤال ${index + 1} / ${data[currentCategory].length}`;

    $("questionText").textContent =
      data[currentCategory][index];

    $("turnName").textContent =
      players[turn];

    currentIndex = index;

    show("questionScreen");

  } else {

    openQuestion(index);

  }
}


/* =====================================================
   RANDOM CATEGORY
===================================================== */

function randomCategory() {

  const categories =
    Object.keys(data);

  const random =
    categories[
      Math.floor(
        Math.random() * categories.length
      )
    ];

  openCategory(random);
}


/* =====================================================
   START
===================================================== */

renderCategories();

</script>
